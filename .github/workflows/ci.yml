name: Run linter and tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main, template-upgrade-test]

jobs:
  grafana_preview_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Test Grafana preview with disposable Git repositories
        run: python3 -m unittest discover -s scripts/tests -v

  grafana_query_telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Start disposable Grafana query telemetry stack
        run: docker compose -p sentinel-query-tests -f scripts/tests/grafana-query-telemetry/compose.yml up -d
      - name: Test failed SQL, timeouts, attribution and slow requests
        run: GRAFANA_TELEMETRY_TEST=1 python3 -m unittest discover -s scripts/tests -p test_grafana_query_telemetry.py -v
      - name: Show test stack diagnostics on failure
        if: failure()
        run: docker compose -p sentinel-query-tests -f scripts/tests/grafana-query-telemetry/compose.yml logs --tail=100
      - name: Remove disposable services and data
        if: always()
        run: docker compose -p sentinel-query-tests -f scripts/tests/grafana-query-telemetry/compose.yml down -v

  linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.17"
      - name: Prepare environment
        run: ./setup-dev.sh
      - name: Install nox
        run: uv tool install --with pyyaml nox
      - name: Run linters
        run: uvx nox -vs lint
  type_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.17"
      - name: Prepare environment
        run: ./setup-dev.sh
      - name: Install nox
        run: uv tool install --with pyyaml nox
      - name: Run type checker
        run: uvx nox -vs type_check
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.17"
      - name: Prepare environment
        run: ./setup-dev.sh
      - name: Run dockerized services
        run: docker compose up -d --wait db redis
      - name: Run migrations
        run: cd app/src && uv run python manage.py wait_for_database --timeout 120 && uv run python manage.py migrate
      - name: Install nox
        run: uv tool install --with pyyaml nox
      - name: Run unit tests
        run: uvx nox -vs test
      - name: Coverage comment on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: MishaKav/pytest-coverage-comment@dd5b80bde6d16941f336518e92929e89069d8451  # v1.7.2
        with:
          pytest-xml-coverage-path: ./app/src/coverage.xml
          coverage-path-prefix: app/src/
          default-branch: master
          title: Coverage Report
          badge-title: Coverage
          hide-badge: false
          hide-report: false
          report-only-changed-files: false
          remove-links-to-lines: true
      - name: Stop dockerized services
        if: success() || failure()
        run: docker compose down -v
  e2e:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.17"
          python-version: "3.14"
      - name: Prepare environment
        run: ./setup-dev.sh
      - name: Run dockerized services
        run: docker compose --profile e2e up -d --wait db redis localnet
      - name: Run migrations
        run: cd app/src && uv run python manage.py wait_for_database --timeout 120 && uv run python manage.py migrate
      - name: Install nox
        run: python -m pip install --upgrade nox
      - name: Run end-to-end tests
        run: nox -vs test_e2e
      - name: Stop dockerized services
        if: success() || failure()
        run: docker compose --profile e2e down -v
