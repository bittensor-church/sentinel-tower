# HTTP-context maps. Log only query requests; never bodies, SQL, credentials or
# full Referer URLs. Context is supplied by Grafana's browser client, not verified
# SQL scope. Missing context remains explicit rather than guessing a panel.
map $uri $sentinel_is_query {
    default 0;
    /grafana/api/ds/query 1;
    ~^/grafana/apis/query\.grafana\.app/[^/]+/namespaces/[^/]+/query$ 1;
}
map $http_x_dashboard_uid $sentinel_dashboard_uid {
    default unknown;
    "~^[A-Za-z0-9_-]{1,64}$" $http_x_dashboard_uid;
}
map $http_x_panel_id $sentinel_panel_id {
    default unknown;
    "~^(?:panel-)?(?<sentinel_panel_number>[0-9]{1,8})$" $sentinel_panel_number;
}
map $http_x_datasource_uid $sentinel_datasource_uid {
    default unknown;
    "~^[A-Za-z0-9_-]{1,64}$" $http_x_datasource_uid;
}
map $http_x_dashboard_title $sentinel_dashboard_title {
    default $sentinel_dashboard_uid;
    "~^.{1,128}$" $http_x_dashboard_title;
}
map $http_x_panel_title $sentinel_panel_title {
    default $sentinel_panel_id;
    "~^.{1,128}$" $http_x_panel_title;
}
map $http_referer $sentinel_query_netuid {
    default unknown;
    # Repeated variables, both variable names, or a comma-separated selection.
    ~[?&]var-(?:netuid|subnet)=[^&]*.*[?&]var-(?:netuid|subnet)= multiple;
    ~*[?&]var-(?:netuid|subnet)=[^&]*(?:,|%2c) multiple;
    ~*[?&]var-(?:netuid|subnet)=(?:All|\$__all|%24__all)(?:&|$) all;
    "~[?&]var-(?:netuid|subnet)=(?<sentinel_selected_netuid>[0-9]{1,5})(?:&|$)" $sentinel_selected_netuid;
}
map $http_referer $sentinel_subnet_variable {
    default unknown;
    ~[?&]var-netuid= netuid;
    ~[?&]var-subnet= subnet;
}
log_format sentinel_grafana_query escape=json
    '{"event":"sentinel_grafana_query","timestamp":$msec,'
    '"dashboard_uid":"$sentinel_dashboard_uid","panel_id":"$sentinel_panel_id",'
    '"dashboard_title":"$sentinel_dashboard_title","panel_title":"$sentinel_panel_title",'
    '"datasource_uid":"$sentinel_datasource_uid","netuid":"$sentinel_query_netuid",'
    '"subnet_variable":"$sentinel_subnet_variable","status_code":"$status",'
    '"duration_seconds":$request_time,"request_id":"$request_id"}';

# Each protected central scrape also tests nginx -> Docker logs -> Alloy, even
# with no dashboard traffic. A working /metrics alone cannot prove ingestion.
log_format sentinel_query_collector_heartbeat escape=json
    '{"event":"sentinel_query_collector_heartbeat","timestamp":$msec}';
