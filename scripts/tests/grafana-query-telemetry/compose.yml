# Disposable local integration stack. Start explicitly; tests never start Docker.
services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_PASSWORD: test-only
    tmpfs: [/var/lib/postgresql/data]
  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SERVER_ROOT_URL: http://localhost:18380/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      # Keep bundled plugins fixed: background updates can kill in-flight test queries.
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
    volumes:
      - ./datasources.yml:/etc/grafana/provisioning/datasources/test.yml:ro
  nginx:
    image: nginx:1.28-alpine
    ports: ['127.0.0.1:18380:80']
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../../nginx/config_helpers:/etc/nginx/config_helpers:ro
      - logs:/logs
    depends_on: [grafana]
  alloy:
    image: grafana/alloy:v1.21.1
    command: [run, --server.http.listen-addr=0.0.0.0:12345, /test/config.alloy]
    ports: ['127.0.0.1:18345:12345']
    volumes:
      - ./config.alloy:/test/config.alloy:ro
      - ../../../alloy:/etc/alloy:ro
      - logs:/logs:ro
volumes:
  logs:
