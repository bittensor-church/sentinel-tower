events {}
http {
    include /etc/nginx/config_helpers/grafana-query-telemetry.conf;
    server {
        listen 80;
        access_log /logs/queries.log sentinel_grafana_query if=$sentinel_is_query;
        location = /grafana-query-metrics/ {
            access_log /logs/queries.log sentinel_query_collector_heartbeat;
            proxy_pass http://alloy:12345/metrics;
        }
        location = /telemetry-test-log {
            alias /logs/queries.log;
        }
        location /grafana/ {
            proxy_pass http://grafana:3000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Request-ID $request_id;
            # Shorter only in this disposable fixture, to exercise a real 504.
            proxy_read_timeout 7s;
        }
    }
}
