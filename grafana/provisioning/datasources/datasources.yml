apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: PostgreSQL
    type: postgres
    uid: postgresql
    access: proxy
    url: db:5432
    database: $POSTGRES_DB
    user: $POSTGRES_USER
    secureJsonData:
      password: $POSTGRES_PASSWORD
    jsonData:
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    editable: false

  # Central Loki with the same credentials Alloy ships with (README "Log
  # aggregation"). Feeds the Postgres Slow Statements dashboard.
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: $LOKI_URL
    basicAuth: true
    basicAuthUser: $LOKI_USER
    secureJsonData:
      basicAuthPassword: $LOKI_PASSWORD
    jsonData:
      maxLines: 1000
    editable: false
